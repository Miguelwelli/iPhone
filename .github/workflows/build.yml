name: Build iOS IPA

on:
  push:
    branches: [ main, "arena/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$LATEST_XCODE" ]; then
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: Install xtool
        run: |
          brew install --cask xtool-org/tap/xtool || brew install xtool-org/tap/xtool
          xtool --version || xtool --help

      - name: Build IPA
        run: |
          mkdir -p build
          if xtool dev build --ipa; then
            echo "Built IPA directly with xtool dev build --ipa"
            cp xtool/*.ipa build/ 2>/dev/null || true
          elif xtool dev build; then
            echo "Built .app with xtool dev build"
          fi

      - name: Package IPA (fallback)
        run: |
          mkdir -p build
          if ! ls build/*.ipa 1>/dev/null 2>&1; then
            for app_dir in xtool/*.app; do
              if [ -d "$app_dir" ]; then
                app_name=$(basename "$app_dir" .app)
                mkdir -p build/Payload
                cp -R "$app_dir" build/Payload/
                (cd build && zip -r "${app_name}.ipa" Payload)
              fi
            done
          fi
          ls -lh build/*.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NextVR-IPA
          path: build/*.ipa
          if-no-files-found: error

      - name: Publish Public Release IPA (Sem Login)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nextvr-ipa"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/*.ipa --clobber
            gh release edit "$TAG" --title "Next VR (.ipa para iPhone)" --notes "Download direto do aplicativo **Next VR (.ipa)** para iPhone (sem precisar de login)."
          else
            gh release create "$TAG" build/*.ipa --target "${{ github.sha }}" --title "Next VR (.ipa para iPhone)" --notes "Download direto do aplicativo **Next VR (.ipa)** para iPhone (sem precisar de login)."
          fi
